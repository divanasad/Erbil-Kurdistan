<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erbil Restaurant Menu</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #121212; color: white; text-align: center; }
        header { background: #b71c1c; padding: 15px; border-bottom: 5px solid #ffca28; position: sticky; top: 0; z-index: 100; }
        .category-title { color: #ffca28; margin-top: 25px; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #333; display: inline-block; padding-bottom: 5px; }
        .menu-container { padding: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        
        .food-btn { 
            background: #1e1e1e; border: 1px solid #444; color: white; 
            padding: 15px; width: 100%; max-width: 450px; border-radius: 10px;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1rem; cursor: pointer; transition: 0.2s;
        }
        .food-btn:active { background: #333; transform: scale(0.98); }
        .btn-price { color: #ffca28; font-weight: bold; }

        #display-area { display: none; padding: 20px; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #121212; z-index: 200; overflow-y: auto; }
        .food-img { width: 100%; max-width: 500px; border-radius: 15px; border: 2px solid #ffca28; margin-top: 20px; }
        .display-price { color: #ffca28; font-size: 2rem; font-weight: bold; margin: 15px 0; }
        .btn-back { background: #b71c1c; color: white; padding: 15px 40px; border: none; border-radius: 50px; font-weight: bold; margin-top: 20px; font-size: 1.1rem; }
    </style>
</head>
<body>

<header>
    <h2 style="margin:0;">ERBIL RESTAURANT</h2>
    <p style="margin:0; font-size: 0.8rem; color: #ffca28;">Thessaloniki - Digital Menu</p>
</header>

<div id="menu-list" class="menu-container">
    
    <div class="category-title">🔥 From the Grill</div>
    <button class="food-btn" onclick="showFood('kebab')"><span>Kebab (1 Shish)</span> <span class="btn-price">€5.00</span></button>
    <button class="food-btn" onclick="showFood('chicken_grill')"><span>Chicken Grill (1 Shish)</span> <span class="btn-price">€5.00</span></button>
    <button class="food-btn" onclick="showFood('beef_grill')"><span>Beef Grill (1 Shish)</span> <span class="btn-price">€5.00</span></button>

    <div class="category-title">🍽️ Main Plates</div>
    <button class="food-btn" onclick="showFood('rice_soup')"><span>Rice & Any Soup</span> <span class="btn-price">€8.00</span></button>
    <button class="food-btn" onclick="showFood('rice_chicken')"><span>Rice & Grilled Chicken</span> <span class="btn-price">€8.00</span></button>
    <button class="food-btn" onclick="showFood('beef_meat')"><span>Beef Meat Plate</span> <span class="btn-price">€8.00</span></button>
    <button class="food-btn" onclick="showFood('kuftes')"><span>3 Kuftes Plate</span> <span class="btn-price">€9.00</span></button>
    <button class="food-btn" onclick="showFood('biriani')"><span>Biriani with Any Soup</span> <span class="btn-price">€5.00</span></button>

    <div class="category-title">🥣 Sides & Soups</div>
    <button class="food-btn" onclick="showFood('lentil')"><span>Lentil Soup</span> <span class="btn-price">€5.00</span></button>
    <button class="food-btn" onclick="showFood('chickpea')"><span>Chickpea Plate</span> <span class="btn-price">€5.00</span></button>
    <button class="food-btn" onclick="showFood('falafel')"><span>Falafel Sandwich</span> <span class="btn-price">€3.00</span></button>

    <div class="category-title">☕ Drinks</div>
    <button class="food-btn" onclick="showFood('tea')"><span>Kurdish Black Tea (Chai)</span> <span class="btn-price">€0.50</span></button>
    <button class="food-btn" onclick="showFood('airan')"><span>Airan</span> <span class="btn-price">€0.50</span></button>
    <button class="food-btn" onclick="showFood('water')"><span>Water</span> <span class="btn-price">€0.50</span></button>
    <button class="food-btn" onclick="showFood('cola')"><span>Cola</span> <span class="btn-price">€1.00</span></button>

</div>

<div id="display-area">
    <img id="food-pic" class="food-img" src="" alt="Erbil Food">
    <h2 id="food-title" style="color:#ffca28; margin-bottom:0;"></h2>
    <p id="display-price" class="display-price"></p>
    <button class="btn-back" onclick="goBack()">Close</button>
</div>

<script>
    const foodData = {
        "kebab": { name: "Kebab (1 Shish)", price: "€5.00", img: "kebab.jpg" },
        "chicken_grill": { name: "Chicken Grill (1 Shish)", price: "€5.00", img: "chicken.jpg" },
        "beef_grill": { name: "Beef Grill (1 Shish)", price: "€5.00", img: "beef_grill.jpg" },
        "rice_soup": { name: "Rice & Any Soup", price: "€8.00", img: "rice_soup.jpg" },
        "lentil": { name: "Lentil Soup", price: "€5.00", img: "lentil.jpg" },
        "rice_chicken": { name: "Rice & Grilled Chicken", price: "€8.00", img: "rice_chicken.jpg" },
        "biriani": { name: "Biriani & Soup", price: "€5.00", img: "biriani.jpg" },
        "beef_meat": { name: "Beef Meat Plate", price: "€8.00", img: "beef.jpg" },
        "chickpea": { name: "Chickpea", price: "€5.00", img: "chickpea.jpg" },
        "kuftes": { name: "3 Kuftes", price: "€9.00", img: "kuftes.jpg" },
        "falafel": { name: "Falafel Sandwich", price: "€3.00", img: "falafel.jpg" },
        "tea": { name: "Kurdish Black Tea", price: "€0.50", img: "tea.jpg" },
        "water": { name: "Water", price: "€0.50", img: "water.jpg" },
        "airan": { name: "Airan", price: "€0.50", img: "airan.jpg" },
        "cola": { name: "Cola", price: "€1.00", img: "cola.jpg" }
    };

    function showFood(id) {
        const item = foodData[id];
        document.getElementById('food-pic').src = item.img;
        document.getElementById('food-title').innerText = item.name;
        document.getElementById('display-price').innerText = item.price;
        document.getElementById('display-area').style.display = 'block';
    }

    function goBack() {
        document.getElementById('display-area').style.display = 'none';
    }
</script>

</body>
</html>
