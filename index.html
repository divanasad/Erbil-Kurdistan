<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erbil Thessaloniki - 3D Menu</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #121212; color: white; text-align: center; }
        header { background: #b71c1c; padding: 25px; border-bottom: 5px solid #ffca28; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .container { padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 0 auto; border-radius: 20px; border: 3px solid #ffca28; }
        model-viewer { width: 100%; height: 400px; margin-top: 20px; display: none; background: #222; border-radius: 20px; }
        .food-info { margin-top: 20px; display: none; padding: 20px; background: #1e1e1e; border-radius: 15px; }
        .price { color: #ffca28; font-size: 1.5rem; font-weight: bold; }
        .btn-wa { background: #25d366; color: white; padding: 15px 30px; text-decoration: none; border-radius: 50px; font-weight: bold; display: inline-block; margin-top: 15px; }
        .btn-scan { background: #555; color: white; padding: 10px 20px; border: none; border-radius: 5px; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <h1 style="margin:0;">ERBIL RESTAURANT</h1>
    <p style="margin:5px 0 0 0; color: #ffca28;">Thessaloniki - 3D Interactive Menu</p>
</header>

<div class="container">
    <div id="reader"></div>
    <p id="hint">Point your camera at the food barcode on the table</p>

    <div id="display-area">
        <h2 id="food-title" style="color:#ffca28;"></h2>
        <model-viewer id="viewer" src="" auto-rotate camera-controls shadow-intensity="1" ar ar-modes="webxr scene-viewer quick-look"></model-viewer>
        
        <div class="food-info" id="food-desc">
            <p id="description"></p>
            <p class="price" id="price"></p>
            <a id="wa-link" href="#" class="btn-wa">Order via WhatsApp</a>
            <br>
            <button class="btn-scan" onclick="location.reload()">Scan Another Dish</button>
        </div>
    </div>
</div>

<script>
    const foodData = {
        "ERBIL01": { 
            name: "Mixed Kebab Erbil", 
            model: "https://modelviewer.dev/shared-assets/models/glTF-Sample-Assets/Models/FoodPlate/glTF-Binary/FoodPlate.glb", 
            price: "€13.50",
            desc: "A mix of lamb and chicken kebabs served with grilled tomatoes and pita."
        },
        "ERBIL02": { 
            name: "Traditional Shawarma", 
            model: "https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/Duck/glTF-Binary/Duck.glb", 
            price: "€6.00",
            desc: "Thinly sliced meat with garlic sauce and Erbil's secret spices."
        }
    };

    function onScanSuccess(decodedText) {
        const item = foodData[decodedText];
        if (item) {
            document.getElementById('reader').style.display = 'none';
            document.getElementById('hint').style.display = 'none';
            
            const viewer = document.getElementById('viewer');
            viewer.style.display = 'block';
            viewer.src = item.model;
            
            document.getElementById('food-title').innerText = item.name;
            document.getElementById('description').innerText = item.desc;
            document.getElementById('price').innerText = item.price;
            
            // Set WhatsApp Link (Replace '123456789' with Erbil Restaurant's actual phone number)
            document.getElementById('wa-link').href = "https://wa.me/30123456789?text=I%20would%20like%20to%20order%20" + encodeURIComponent(item.name);
            
            document.getElementById('food-desc').style.display = 'block';
            html5QrcodeScanner.clear();
        }
    }

    let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    html5QrcodeScanner.render(onScanSuccess);
</script>

</body>
</html>
